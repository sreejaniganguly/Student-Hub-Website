<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="style.css">
</head>
        <body> 

            <!--HEADER-->
    <header>

         <nav class="navbar">

            <h2>CodeNest</h2>
            <ul class="nav-links">
                <li><a href="#">Home</a></li> 
                <li><a href="#">Courses</a></li>
                <li><a href="#">Resources</a></li>
                <li><a href="#">About Us</a></li>
            </ul>
        </nav>
     </header>

     <!--MAIN HERO SECTION-->
       <main class="hero">


        <!--LEFT SIDE-->
        <div class="hero-left">

            <h1>
                Start Your<br>
                <span>Coding Journey</span><br>
                Today!
            </h1>

            <p class="description">
                Learn HTML, CSS, JavaScript and build amazing
                <br>
                projects for free.
            </p>

            <img src="https://static.vecteezy.com/system/resources/thumbnails/031/714/566/small_2x/laptop-with-cup-of-coffee-and-plant-in-pot-workplace-of-coder-online-programmer-coding-and-programming-developing-sites-using-special-language-illustration-vector.jpg"coding>

        </div>

     <!--RIGHT SIDE-SIGNUP BOX-->
        <div class="container">

    <h1>Create Your Account</h1>
    <p class="subtitle">Let's get started</p>

    <form>
        <!--Name-->
        <div class="input-box">
        <label> Full Name </label>
        <input type="text"placeholder="Enter your full name">
        </div>

        <!--Email-->
        <div class="input-box">
        <label>Email Address</label>
        <input type="email"placeholder="Enter your email">
        </div>
        
        <!--Password-->
        <div class="input-box">
        <label>Password </label>
        <input type="password"placeholder="Create a password">
        </div>
         
<div class="row">

        <!--Year of Study-->
        <div class="field">
        <label> Year of study </label>
        <select>
            <option value="1st year">1st year</option>
            <option value="2nd year">2nd year</option>
            <option value="3rd year">3rd year</option>
            <option value="4th year">4th year</option>
        </select>
        </div>

        <!--Area of Interest-->
        <div class="field">
            
            <label>Area of interest</label>
            <select name="Area of interest" id="Area of interest">
                <option value="web development">Web development</option>
                <option value="data science">Data science</option>
                <option value="cyber security">Cyber security</option>
                <option value="artificial intelligence">Artificial intelligence</option>
                <option value="DSA">Data structure & Algorithms</option>
           </select>
        </div>
 </div>

         <div class="input-box">
           <textarea name="message" id="message" cols="60" rows="10" placeholder="If you would like to tell us what insipre you to choose your desired course..."></textarea>
         </div>

         <button>Sign Up</button>
</div>
</main>

    <footer>

        </nav>

        <p>Made with ❤️ for learners</p>
        
    </footer>
    
</body>
</html>
